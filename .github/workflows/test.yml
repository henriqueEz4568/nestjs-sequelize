name: Run Tests on PR to dev

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Ou a versão que você estiver usando

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes
        run: npm run test
